<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Calculator</title>
<meta name="description" content="Barbell plate calculator: enter a target weight and see which plates to load on each side.">
<meta name="theme-color" content="#2a2a2d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a2a2d'/%3E%3Crect x='6' y='6' width='6' height='20' rx='2' fill='%23d92b2b'/%3E%3Crect x='20' y='6' width='6' height='20' rx='2' fill='%23d92b2b'/%3E%3Crect x='12' y='14' width='8' height='4' fill='%239b9a94'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #2a2a2d;
  --panel: #313136;
  --panel-press: #3d3d43;
  --line: #44444a;
  --red: #d92b2b;        /* fills */
  --red-text: #ff5d55;   /* red used as text: meets WCAG AA on --bg */
  --text: #ecebe6;
  --muted: #9c9ca2;
  --bar: #9b9a94;
  --amber: #e0b04a;
  --display: 'Bebas Neue', Oswald, Impact, 'Arial Narrow', sans-serif;
  --mono: 'JetBrains Mono', 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--mono); font-size: 15px; line-height: 1.4;
}
button { font: inherit; color: inherit; }
.app { max-width: 440px; margin: 0 auto; padding-bottom: 32px; }
header { border-bottom: 2px solid var(--red); padding: 14px 16px 10px; text-align: center; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 2rem; letter-spacing: .08em; color: var(--red-text); }
main { padding: 0 16px; }

.label { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.row-head { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; min-height: 44px; }
.link {
  background: none; border: 0; padding: 0 4px; min-height: 44px; cursor: pointer;
  color: var(--red-text); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation;
}
.link:hover { text-decoration: underline; }
.link svg { width: 14px; height: 14px; fill: currentColor; }

.target-box { background: var(--panel); border-radius: 10px; padding: 8px 12px 10px; text-align: center; }
#target {
  width: 100%; background: transparent; border: 0; color: var(--text); text-align: center;
  font-family: var(--mono); font-weight: 700; font-size: 4rem; line-height: 1.15; padding: 0; outline: none;
}
.target-box:focus-within, input.small:focus { outline: 2px solid var(--red-text); outline-offset: 1px; }
.unit-tag { font-size: .8rem; color: var(--muted); letter-spacing: .15em; }

.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.btn {
  background: var(--panel); border: 0; border-radius: 8px; min-height: 48px; min-width: 44px; cursor: pointer;
  font-weight: 700; font-size: 1rem; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--panel-press); transform: translateY(1px); }
.btn:focus-visible, .link:focus-visible, .chip:focus-visible, .seg button:focus-visible, .done:focus-visible {
  outline: 2px solid var(--red-text); outline-offset: 2px;
}
.btn:disabled { opacity: .35; cursor: default; }
.btn:disabled:active { background: var(--panel); transform: none; }

.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.bar-field { display: flex; align-items: center; gap: 10px; }
input.small {
  width: 84px; min-height: 44px; background: var(--panel); border: 0; border-radius: 8px;
  color: var(--text); font-family: var(--mono); font-size: 1.1rem; font-weight: 700; text-align: center;
}
.seg { display: inline-flex; background: var(--panel); border-radius: 8px; padding: 3px; }
.seg button {
  background: none; border: 0; border-radius: 6px; min-height: 44px; min-width: 52px; cursor: pointer;
  font-weight: 700; letter-spacing: .08em; color: var(--muted); touch-action: manipulation;
}
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }

h2 { margin: 0; }
.bar-card { margin-top: 4px; }
svg#bar { display: block; width: 100%; height: auto; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; color: var(--muted); font-size: .9rem; min-height: 1.4em; margin-top: 2px; }
.sides div { overflow-wrap: anywhere; }
.sides div:first-child { text-align: left; }
.sides div:last-child { text-align: right; }
.sides i { font-style: normal; color: #5f5f66; padding: 0 1px; }
.note { margin: 12px 0 0; min-height: 1.4em; color: var(--amber); font-size: .85rem; }

/* modal */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none;
  align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.backdrop.open { display: flex; }
.modal {
  background: var(--panel); border-radius: 14px; width: 100%; max-width: 400px; max-height: 92vh; overflow: auto;
  padding: 18px 16px 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.modal h2 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .06em; }
.modal p { margin: 6px 0 12px; color: var(--muted); font-size: .8rem; }
.cols { text-align: right; padding-right: 8px; }
.prow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); }
.swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(255,255,255,.35); flex: none; }
.pname { font-weight: 700; width: 4.6em; flex: none; white-space: nowrap; }
.pname small { color: var(--muted); font-weight: 400; font-size: .7rem; }
.chip {
  margin-left: auto; min-height: 44px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  font-size: .62rem; letter-spacing: .1em; font-weight: 700; touch-action: manipulation;
}
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.step { min-height: 44px; min-width: 44px; background: var(--bg); }
.count { width: 2.2em; text-align: center; font-weight: 700; font-size: 1.05rem; }
.done-wrap { text-align: right; border-top: 1px solid var(--line); margin-top: 6px; }
.done { background: none; border: 0; min-height: 48px; padding: 0 8px; cursor: pointer; color: var(--red-text);
  font-family: var(--display); font-weight: 700; font-size: 1.4rem; letter-spacing: .08em; }

@media (max-width: 380px) {
  #target { font-size: 3.4rem; }
  .chip { padding: 0 7px; letter-spacing: .04em; }
}
</style>
</head>
<body>
<div class="app">
  <header><h1>PLATE CALCULATOR</h1></header>

  <main id="main">
    <div class="row-head">
      <label class="label" for="target" id="targetLabel">Target weight</label>
      <button class="link" id="clear" type="button">Clear</button>
    </div>
    <div class="target-box">
      <input id="target" type="text" inputmode="decimal" autocomplete="off" value="100" aria-describedby="targetUnit">
      <div class="unit-tag" id="targetUnit">KG</div>
    </div>

    <div class="quick" id="quickPlus"></div>
    <div class="quick" id="quickMinus"></div>

    <div class="bar-row">
      <div class="bar-field">
        <label class="label" for="barw">Bar weight</label>
        <input class="small" id="barw" type="text" inputmode="decimal" autocomplete="off" value="20">
      </div>
      <div class="seg" role="group" aria-label="Unit">
        <button type="button" data-unit="kg" aria-pressed="true">KG</button>
        <button type="button" data-unit="lb" aria-pressed="false">LB</button>
      </div>
    </div>

    <div class="row-head">
      <h2 class="label">Loaded bar</h2>
      <button class="link" id="openModal" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        Plates available
      </button>
    </div>
    <div class="bar-card">
      <svg id="bar" viewBox="0 0 328 150" role="img" aria-label="Empty bar"></svg>
      <div class="sides"><div id="sideL"></div><div id="sideR"></div></div>
    </div>
    <p class="note" id="note" aria-live="polite"></p>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mHelp">
    <h2 id="mTitle">Plates Available</h2>
    <p id="mHelp">Pairs available per plate — one pair loads one on each side.</p>
    <div class="label cols">Pairs</div>
    <div id="rows"></div>
    <div class="done-wrap"><button class="done" id="done" type="button">Done</button></div>
  </div>
</div>

<script>
'use strict';

/* ---------- data ---------- */
var PLATE_SETS = {
  kg: { bar: 20, plates: [
    { weight: 25,   color: '#d92b2b', h: 1.00, limited: true,  pairs: 1 },
    { weight: 20,   color: '#1f4e8c', h: 0.92, limited: true,  pairs: 1 },
    { weight: 15,   color: '#f2c230', h: 0.80, limited: false, pairs: 1 },
    { weight: 10,   color: '#2f7d32', h: 0.70, limited: false, pairs: 1 },
    { weight: 5,    color: '#e9e8e3', h: 0.58, limited: false, pairs: 1 },
    { weight: 2.5,  color: '#1a1a1a', h: 0.46, limited: true,  pairs: 1 },
    { weight: 1.25, color: '#b9bbc0', h: 0.38, limited: true,  pairs: 1 }
  ]},
  lb: { bar: 45, plates: [
    { weight: 45,  color: '#d92b2b', h: 1.00, limited: true,  pairs: 1 },
    { weight: 35,  color: '#1f4e8c', h: 0.92, limited: true,  pairs: 1 },
    { weight: 25,  color: '#f2c230', h: 0.80, limited: false, pairs: 1 },
    { weight: 10,  color: '#2f7d32', h: 0.70, limited: false, pairs: 1 },
    { weight: 5,   color: '#e9e8e3', h: 0.58, limited: false, pairs: 1 },
    { weight: 2.5, color: '#1a1a1a', h: 0.46, limited: true,  pairs: 1 }
  ]}
};
var MAX_PAIRS = 99;
var MAX_TARGET = { kg: 1000, lb: 2200 };

function freshPlates(unit) { return PLATE_SETS[unit].plates.map(function (p) { return Object.assign({}, p); }); }

/* ---------- state ---------- */
var STORE_KEY = 'plateCalc.v1';
var state = { unit: 'kg', target: 100, bar: 20, plates: freshPlates('kg'), modalOpen: false };
var other = { bar: PLATE_SETS.lb.bar, plates: freshPlates('lb') };   // saved inventory of the unit not in use

function otherUnit() { return state.unit === 'kg' ? 'lb' : 'kg'; }

/* Persistence is best-effort: storage can be missing or blocked. */
function save() {
  try {
    var o = {};
    o[state.unit] = { bar: state.bar, plates: state.plates };
    o[otherUnit()] = other;
    localStorage.setItem(STORE_KEY, JSON.stringify({ unit: state.unit, target: state.target, inv: o }));
  } catch (e) {}
}
function cleanPlates(unit, saved) {
  var out = freshPlates(unit);
  if (!Array.isArray(saved)) return out;
  out.forEach(function (p) {
    var m = saved.filter(function (q) { return q && q.weight === p.weight; })[0];
    if (!m) return;
    p.limited = m.limited !== false;
    var n = Math.floor(Number(m.pairs));
    p.pairs = isFinite(n) ? Math.min(MAX_PAIRS, Math.max(0, n)) : 1;
  });
  return out;
}
function load() {
  try {
    var d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!d || !PLATE_SETS[d.unit]) return;
    var num = function (v, def) { v = Number(v); return isFinite(v) && v >= 0 ? v : def; };
    state.unit = d.unit;
    state.target = num(d.target, state.target);
    var cur = (d.inv || {})[state.unit] || {}, oth = (d.inv || {})[otherUnit()] || {};
    state.bar = num(cur.bar, PLATE_SETS[state.unit].bar);
    state.plates = cleanPlates(state.unit, cur.plates);
    other = { bar: num(oth.bar, PLATE_SETS[otherUnit()].bar), plates: cleanPlates(otherUnit(), oth.plates) };
  } catch (e) {}
}

/* ---------- pure logic ---------- */
function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
function round2(x) { return Math.round(x * 100) / 100; }
function fmt(x) { return String(round2(x)); }

/* Closest achievable per-side load. Plates: [{weight, limited, pairs}].
   Returns { plates: weights heaviest-first, total }. Ties: lower sum, then fewest
   plates, then heaviest plates first. Integer DP over the gcd of the plate weights. */
function solve(perSide, plates) {
  var list = plates
    .filter(function (p) { return !p.limited || p.pairs > 0; })
    .map(function (p) { return { w: Math.round(p.weight * 100), cap: p.limited ? p.pairs : Infinity, weight: p.weight }; })
    .sort(function (a, b) { return b.w - a.w; });
  if (!list.length || !(perSide > 0)) return { plates: [], total: 0 };

  var g = list.reduce(function (a, p) { return gcd(a, p.w); }, 0);
  var ws = list.map(function (p) { return p.w / g; });
  var target = perSide * 100 / g;
  var M = Math.floor(target) + ws[0] + 1;
  var n = list.length, i, s, k;

  // f[i][s] = fewest plates from list[i..] summing to exactly s
  var f = [];
  for (i = 0; i <= n; i++) f.push(new Array(M + 1).fill(Infinity));
  f[n][0] = 0;
  for (i = n - 1; i >= 0; i--) {
    for (s = 0; s <= M; s++) {
      var best = Infinity;
      for (k = 0; k <= list[i].cap && k * ws[i] <= s; k++) {
        var v = k + f[i + 1][s - k * ws[i]];
        if (v < best) best = v;
      }
      f[i][s] = best;
    }
  }

  var bs = 0, bd = Infinity;
  for (s = 0; s <= M; s++) {
    if (f[0][s] === Infinity) continue;
    var d = Math.abs(s - target);
    if (d < bd - 1e-9) { bd = d; bs = s; }   // strict: equal distance keeps the lower sum
  }

  var out = [];
  s = bs;
  for (i = 0; i < n; i++) {
    for (k = Math.min(list[i].cap, Math.floor(s / ws[i])); k >= 0; k--) {
      if (k + f[i + 1][s - k * ws[i]] === f[i][s]) {   // most of the heaviest plate first
        for (var j = 0; j < k; j++) out.push(list[i].weight);
        s -= k * ws[i];
        break;
      }
    }
  }
  return { plates: out, total: round2(bs * g / 100) };
}

/* Full result for the current state. */
function compute(st) {
  var target = Math.max(0, st.target || 0), bar = Math.max(0, st.bar || 0), u = st.unit;
  if (target > MAX_TARGET[u]) return { plates: [], note: 'Too heavy for this tool' };
  if (target < bar) return { plates: [], note: 'Target is lighter than the bar.' };
  var r = solve((target - bar) / 2, st.plates);
  var load = round2(bar + 2 * r.total), diff = round2(target - load);
  var note = '';
  if (Math.abs(diff) >= 0.005) {
    note = "Can't load " + fmt(target) + ' ' + u + ' exactly with these plates. Closest: ' +
      fmt(load) + ' ' + u + ' (' + fmt(Math.abs(diff)) + ' ' + u + (diff > 0 ? ' under' : ' over') + ').';
  }
  return { plates: r.plates, note: note };
}

/* Quick self-check, silent when everything passes. */
(function selfTest() {
  function run(t) {
    var st = { unit: 'kg', target: t, bar: 20, plates: freshPlates('kg') };
    return compute(st);
  }
  var cases = [
    [100, '25,15', ''], [125, '25,20,5,2.5', ''], [165, '25,20,15,10,2.5', ''],
    [20, '', ''], [15, '', 'Target is lighter than the bar.'],
    [101, '25,15', "Can't load 101 kg exactly with these plates. Closest: 100 kg (1 kg under)."]
  ];
  cases.forEach(function (c) {
    var r = run(c[0]);
    console.assert(r.plates.join(',') === c[1], 'plates for ' + c[0] + ': ' + r.plates.join(','));
    console.assert(r.note === c[2], 'note for ' + c[0] + ': ' + r.note);
  });
  var tricky = solve(30, [{ weight: 25, limited: true, pairs: 1 }, { weight: 20, limited: true, pairs: 1 }, { weight: 10, limited: false, pairs: 1 }]);
  console.assert(tricky.plates.join(',') === '20,10', 'knapsack case: ' + tricky.plates.join(','));
})();

/* ---------- DOM ---------- */
var $ = function (id) { return document.getElementById(id); };
var SVGNS = 'http://www.w3.org/2000/svg';

function parseNum(str) {
  var n = parseFloat(String(str).replace(',', '.'));
  return isFinite(n) && n > 0 ? n : 0;
}
function sanitize(str) {          // digits and one decimal separator only
  var seen = false;
  return str.replace(/,/g, '.').replace(/[^0-9.]/g, function (c) { return ''; }).replace(/\./g, function () {
    if (seen) return '';
    seen = true; return '.';
  });
}
function setText(el, t) { if (el.textContent !== t) el.textContent = t; }

function svgEl(name, attrs) {
  var el = document.createElementNS(SVGNS, name);
  for (var a in attrs) el.setAttribute(a, attrs[a]);
  return el;
}

function plateInfo(weight) {
  for (var i = 0; i < state.plates.length; i++) if (state.plates[i].weight === weight) return state.plates[i];
  return state.plates[0];
}

function drawBar(weights) {
  var svg = $('bar');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var W = 328, H = 150, cy = H / 2, gap = 2, center = 26, maxH = 140;
  var avail = (W - center) / 2;
  var baseW = weights.map(function (w) { return 10 + 26 * plateInfo(w).h; });   // ~36px big, ~20px small
  var need = baseW.reduce(function (a, b) { return a + b; }, 0) + gap * weights.length;
  var scale = need > avail ? avail / need : 1;

  svg.appendChild(svgEl('rect', { x: 0, y: cy - 6, width: W, height: 12, rx: 6, fill: '#9b9a94' }));
  svg.appendChild(svgEl('rect', { x: W / 2 - center / 2, y: cy - 9, width: center, height: 18, rx: 3, fill: '#8a8984' }));

  var off = 0;
  weights.forEach(function (w, i) {
    var p = plateInfo(w), pw = baseW[i] * scale, ph = maxH * p.h;
    var xr = W / 2 + center / 2 + off, xl = W / 2 - center / 2 - off - pw;
    [xl, xr].forEach(function (x) {
      svg.appendChild(svgEl('rect', {
        x: x, y: cy - ph / 2, width: pw, height: ph, rx: Math.min(6, pw / 2),
        fill: p.color, stroke: 'rgba(0,0,0,.55)', 'stroke-width': 1
      }));
      if (p.color === '#1a1a1a') svg.lastChild.setAttribute('stroke', 'rgba(255,255,255,.35)');
    });
    off += pw + gap * scale;
  });
  svg.setAttribute('aria-label', weights.length ? 'Bar loaded with ' + weights.join(', ') + ' per side' : 'Empty bar');
}

function fillSide(el, weights, mirror) {
  var seq = mirror ? weights.slice().reverse() : weights;
  el.textContent = '';
  seq.forEach(function (w, i) {
    if (i) { var b = document.createElement('i'); b.textContent = '|'; el.appendChild(b); }
    el.appendChild(document.createTextNode(String(w)));
  });
}

function render() {
  save();
  var r = compute(state);
  drawBar(r.plates);
  // left reads as drawn (lightest outermost on the left, heaviest at the centre)
  fillSide($('sideL'), r.plates, true);
  fillSide($('sideR'), r.plates, false);
  setText($('note'), r.note);
  var u = state.unit.toUpperCase();
  setText($('targetUnit'), u);
  setText($('targetLabel'), 'Target weight');
}

/* ---------- inputs ---------- */
function bindNumberInput(input, key) {
  input.addEventListener('input', function () {
    var clean = sanitize(input.value);
    if (clean !== input.value) input.value = clean;
    state[key] = parseNum(clean);
    render();
  });
  input.addEventListener('focus', function () { input.select(); });
}
bindNumberInput($('target'), 'target');
bindNumberInput($('barw'), 'bar');

function setTarget(v) {
  state.target = Math.max(0, round2(v));
  $('target').value = state.target ? String(state.target) : '0';
  render();
}

[1, 5, 10, 20, 100].forEach(function (n) {
  [['quickPlus', n, '+'], ['quickMinus', -n, '−']].forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn';
    b.textContent = c[2] + n;
    b.setAttribute('aria-label', (c[1] > 0 ? 'Add ' : 'Subtract ') + n);
    b.addEventListener('click', function () { setTarget(state.target + c[1]); });
    $(c[0]).appendChild(b);
  });
});
$('clear').addEventListener('click', function () { setTarget(0); $('target').focus(); });

document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    var u = b.getAttribute('data-unit');
    if (u === state.unit) return;
    var prev = { bar: state.bar, plates: state.plates };
    state.unit = u;
    state.bar = other.bar;
    state.plates = other.plates;
    other = prev;
    $('barw').value = String(state.bar);
    document.querySelectorAll('.seg button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    if (state.modalOpen) buildRows();
    render();
  });
});

/* ---------- plates available modal ---------- */
var lastFocus = null;

function buildRows() {
  var host = $('rows');
  host.textContent = '';
  state.plates.forEach(function (p, idx) {
    var row = document.createElement('div'); row.className = 'prow';
    row.innerHTML =
      '<span class="swatch" aria-hidden="true"></span>' +
      '<span class="pname"></span>' +
      '<button type="button" class="chip" data-act="nolimit">NO LIMIT</button>' +
      '<button type="button" class="btn step" data-act="dec">−</button>' +
      '<span class="count" aria-live="polite"></span>' +
      '<button type="button" class="btn step" data-act="inc">+</button>';
    row.querySelector('.swatch').style.background = p.color;
    row.querySelector('.pname').innerHTML = p.weight + ' <small>' + state.unit + '</small>';
    var w = p.weight + ' ' + state.unit;
    row.querySelector('[data-act=nolimit]').setAttribute('aria-label', 'No limit for ' + w);
    row.querySelector('[data-act=dec]').setAttribute('aria-label', 'Fewer pairs of ' + w);
    row.querySelector('[data-act=inc]').setAttribute('aria-label', 'More pairs of ' + w);
    row.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      var act = btn.getAttribute('data-act');
      if (act === 'nolimit') { p.limited = !p.limited; if (p.limited) p.pairs = 1; }
      else if (act === 'dec') p.pairs = Math.max(0, p.pairs - 1);
      else if (act === 'inc') p.pairs = Math.min(MAX_PAIRS, p.pairs + 1);
      updateRow(row, p);
      if (btn.disabled) row.querySelector('[data-act=nolimit]').focus();   // keep focus inside the dialog
      render();
    });
    host.appendChild(row);
    updateRow(row, p);
  });
}

function updateRow(row, p) {
  var chip = row.querySelector('[data-act=nolimit]');
  chip.setAttribute('aria-pressed', String(!p.limited));
  row.querySelector('.count').textContent = p.limited ? String(p.pairs) : '∞';
  row.querySelector('[data-act=dec]').disabled = !p.limited || p.pairs <= 0;
  row.querySelector('[data-act=inc]').disabled = !p.limited || p.pairs >= MAX_PAIRS;
}

function openModal() {
  lastFocus = document.activeElement;
  state.modalOpen = true;
  buildRows();
  $('backdrop').classList.add('open');
  $('main').inert = true;
  $('done').focus();
}
function closeModal() {
  state.modalOpen = false;
  $('backdrop').classList.remove('open');
  $('main').inert = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('openModal').addEventListener('click', openModal);
$('done').addEventListener('click', closeModal);
$('backdrop').addEventListener('mousedown', function (e) { if (e.target === $('backdrop')) closeModal(); });
document.addEventListener('keydown', function (e) {
  if (!state.modalOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  var f = Array.prototype.filter.call($('modal').querySelectorAll('button'), function (b) { return !b.disabled; });
  var first = f[0], last = f[f.length - 1];
  if (!$('modal').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* Optional web fonts: only requested when online so offline use stays error-free. */
if (navigator.onLine) {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap';
  document.head.appendChild(l);
}

load();
$('target').value = String(state.target);
$('barw').value = String(state.bar);
document.querySelectorAll('.seg button').forEach(function (x) {
  x.setAttribute('aria-pressed', String(x.getAttribute('data-unit') === state.unit));
});
render();
</script>
</body>
</html>
